packages:
  - "apps/*"
  - "packages/*"
# pnpm 11 substituiu `onlyBuiltDependencies` por `allowBuilds`. Só estes pacotes rodam script de
# instalação — o resto fica sem executar código nosso na máquina.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
